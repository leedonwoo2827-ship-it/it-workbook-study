# KDATA SQLD 공식 출제기준 (공개 자료 기반 스타터)
# 실제 시험 배정 비율(1과목 10문항, 2과목 40문항)을 반영하여 weight 부여
# 이 파일은 Track B 신규생성의 유일한 표준 입력이다.

subject: SQLD
total_questions_default: 50

subjects:
