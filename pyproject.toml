[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exambook"
version = "0.1.0"
description = "IT 자격증(SQLD) 자동출제 파이프라인 — 로컬 LLM + VoiceWright TTS + Marp + ffmpeg"
requires-python = ">=3.11"
authors = [{name = "leedonwoo2827-ship-it", email = "editor0712@ubion.co.kr"}]
license = {text = "MIT"}
readme = "README.md"
dependencies = [
    "ollama==0.4.4",
    "pdf2image==1.17.0",
    "pypdf==4.3.1",
    "Pillow==10.4.0",
    "pydantic==2.9.2",
    "jsonschema==4.23.0",
    "pyyaml==6.0.2",
    "jinja2==3.1.4",
    "typer>=0.15,<0.30",
    "rich==13.9.4",
    "sentence-transformers==3.1.1",
    "numpy<2.0",
    "tqdm==4.66.5",
    "python-slugify==8.0.4",
    "fastapi==0.115.0",
    "uvicorn==0.31.0",
    "python-multipart>=0.0.18",
]

[project.scripts]
exambook = "exambook.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exambook = ["web/templates/*.html", "web/static/*"]
