<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ qid }} — Exambook Studio</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-dot"></div>
        <div>Exambook Studio</div>
      </div>
    </div>
    <div class="sidebar-actions">
      <a class="btn-new" href="/" style="text-align:center; display:inline-block;">← 목록으로</a>
    </div>
    <div class="search-wrap">
      <input class="search" placeholder="문항 검색" id="search">
    </div>
    <div class="sidebar-list">
      {% for id in all_ids %}
        <a class="q-item {% if id == qid %}active{% endif %}" href="/q/{{ id }}">
          <div class="q-id">{{ id }}</div>
        </a>
      {% endfor %}
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>{{ qid }}</h1>
        <span class="meta">data/questions/{{ qid }}.md</span>
      </div>
      <div class="toolbar">
        <a class="btn btn-ghost" href="/pronunciations">발음 사전</a>
        <button class="btn" onclick="save()">저장 (Ctrl+S)</button>
        <button class="btn" onclick="rebuild(false)">슬라이드+음성+영상</button>
        <button class="btn btn-primary" onclick="rebuild(true)">강제 재빌드</button>
      </div>
    </div>

    <div class="content">
      <div class="editor-grid">
        <section class="editor-pane">
          <div class="pane-header">
            <span>편집 (Markdown)</span>
            <span id="save-status" style="color:var(--text-faint);">unchanged</span>
          </div>
          <textarea class="md-editor" id="editor">{{ raw_md }}</textarea>
        </section>

        <section class="preview-pane">
          <div class="pane-header">
            <span>미리보기</span>
            <div>
              <button class="btn btn-ghost" onclick="loadPreviewMedia('slide')">슬라이드</button>
              <button class="btn btn-ghost" onclick="loadPreviewMedia('script')">대본</button>
              <button class="btn btn-ghost" onclick="loadPreviewMedia('audio')">음성</button>
              <button class="btn btn-ghost" onclick="loadPreviewMedia('video')">영상</button>
              <button class="btn btn-ghost" onclick="loadPreviewMedia('parsed')">파싱</button>
            </div>
          </div>
          <div class="preview-body" id="preview"></div>
        </section>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="pron-modal" onclick="if(event.target===this) closePronModal()">
  <div class="modal">
    <div class="modal-header">
      <h2>발음 사전 편집</h2>
      <div class="modal-sub">영문/SQL 키워드를 한글 발음으로 치환. 저장 후 [음성] 탭에서 재합성하면 반영됩니다.</div>
    </div>
    <div class="modal-body">
      <label>키워드 (대소문자 무시, 단어 경계 기준)</label>
      <input id="pron-key" type="text" placeholder="예: SELECT">
      <label>한글 발음</label>
      <input id="pron-val" type="text" placeholder="예: 셀렉트">
      <div id="pron-modal-msg" style="font-size:12px;color:var(--text-muted);margin-top:-6px;margin-bottom:6px;"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="deletePron()" id="pron-delete-btn" style="display:none;color:var(--error)">삭제</button>
      <button class="btn" onclick="closePronModal()">취소</button>
      <button class="btn btn-primary" onclick="savePron()">저장</button>
    </div>
  </div>
</div>

<script>
const QID = "{{ qid }}";
const editor = document.getElementById('editor');
const saveStatus = document.getElementById('save-status');
const preview = document.getElementById('preview');
const toast = document.getElementById('toast');
let dirty = false;

function showToast(msg, kind='info') {
  toast.textContent = msg;
  toast.className = 'toast show ' + kind;
  setTimeout(() => toast.classList.remove('show'), 2400);
}

editor.addEventListener('input', () => {
  if (!dirty) {
    dirty = true;
    saveStatus.textContent = '편집됨 (저장하지 않음)';
    saveStatus.style.color = 'var(--warning)';
  }
});

async function save() {
  const res = await fetch(`/api/q/${QID}`, {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({raw_md: editor.value})
  });
  const data = await res.json();
  if (data.ok) {
    dirty = false;
    saveStatus.textContent = '저장됨';
    saveStatus.style.color = 'var(--success)';
    showToast('저장됨', 'success');
  } else {
    showToast('파싱 오류: ' + data.error, 'error');
  }
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(); }
});

async function rebuild(force) {
  if (dirty) await save();
  showToast('재빌드 중…', 'info');
  const res = await fetch('/api/rebuild', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({qids: [QID], force})
  });
  const data = await res.json();
  if (data.ok) {
    showToast('재빌드 완료', 'success');
    loadPreviewMedia('slide');
  } else showToast('실패: ' + data.error, 'error');
}

function loadPreviewMedia(kind) {
  if (kind === 'slide') {
    preview.innerHTML = `
      <div class="preview-slide"><img src="/preview/slide/${QID}/1?t=${Date.now()}" alt="문제"></div>
      <div class="preview-slide"><img src="/preview/slide/${QID}/2?t=${Date.now()}" alt="정답/해설"></div>`;
  } else if (kind === 'script') {
    renderScriptTab();
  } else if (kind === 'audio') {
    preview.innerHTML = `
      <div class="preview-section-title">문제 본문 음성</div>
      <audio class="preview-audio" controls src="/preview/audio/${QID}/stem?t=${Date.now()}"></audio>
      <div class="preview-section-title">해설 음성</div>
      <audio class="preview-audio" controls src="/preview/audio/${QID}/exp?t=${Date.now()}"></audio>`;
  } else if (kind === 'video') {
    preview.innerHTML = `<video class="preview-video" controls src="/preview/video/${QID}?t=${Date.now()}"></video>`;
  } else if (kind === 'parsed') {
    fetch(`/api/parsed/${QID}`).then(r => r.json()).then(q => {
      const correct = q.answer_index;
      const choices = q.choices.map((c, i) =>
        `<li class="${i === correct ? 'correct' : ''}">${c}</li>`).join('');

      // stem 안의 ```...``` 펜스 코드 추출 (stage5_render 와 동일 로직)
      const fenceRe = /```[a-zA-Z]*\n[\s\S]*?\n```/g;
      const embeddedRaw = q.stem.match(fenceRe) || [];
      const stemBody = q.stem.replace(fenceRe, '').trim();
      const stripFence = (b) => {
        const lines = b.trim().split('\n');
        if (lines.length >= 2 && lines[0].startsWith('```') && lines[lines.length-1].startsWith('```')) {
          return lines.slice(1, -1).join('\n').trim();
        }
        return b.trim();
      };
      // sql_snippet 과 embedded 중복 제거
      const codes = [];
      const seen = new Set();
      if (q.sql_snippet) {
        const s = q.sql_snippet.trim();
        codes.push(s);
        seen.add(s);
      }
      embeddedRaw.forEach(emb => {
        const inner = stripFence(emb);
        if (!seen.has(inner)) {
          seen.add(inner);
          codes.push(inner);
        }
      });
      const sqlHtml = codes.length
        ? `<div class="preview-section-title">SQL</div>` +
          codes.map(c => `<pre class="preview-sql"><code>${escHtml(c)}</code></pre>`).join('')
        : '';

      preview.innerHTML = `
        <div class="preview-stem">${escHtml(stemBody)}</div>
        ${sqlHtml}
        <ul class="preview-choices">${choices}</ul>
        <div class="preview-section-title">해설</div>
        <div class="preview-explanation">${escHtml(q.explanation)}</div>`;
    }).catch(err => { preview.innerHTML = '<div class="empty">파싱 오류: ' + err + '</div>'; });
  }
}

// ---- 대본 탭 (VoiceWright-style) ----

let scriptCache = null;       // 마지막 fetch 결과 캐시
let conversionOn = true;       // true=발음변환 적용, false=원본

async function renderScriptTab() {
  try {
    const res = await fetch(`/api/script/${QID}`);
    if (!res.ok) throw new Error('script fetch failed');
    scriptCache = await res.json();
  } catch (err) {
    preview.innerHTML = '<div class="empty">대본 로드 오류: ' + err + '</div>';
    return;
  }
  drawScriptCards();
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

const editing = {1: false, 2: false};       // 카드별 편집 모드 상태

function drawScriptCards() {
  if (!scriptCache) return;
  const cards = scriptCache.scenes.map(sc => {
    const isEditing = editing[sc.scene];
    const overrideBadge = sc.override_active
      ? '<span style="background:#fce7a8;color:#7a4f01;font-weight:600;padding:2px 8px;border-radius:6px;font-size:11px;margin-left:6px;">수정됨</span>'
      : '';

    let bodyHtml;
    if (isEditing) {
      bodyHtml = `<textarea class="md-editor" id="script-edit-${sc.scene}" style="min-height:180px;background:#fffbe6;border:1px solid #ffe082;border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.65;width:100%;font-family:'SF Mono',Consolas,monospace;resize:vertical;">${escHtml(sc.original)}</textarea>`;
    } else if (conversionOn) {
      bodyHtml = `<div class="scene-text">${sc.segments.map(seg => seg.highlighted
          ? `<span class="pron" data-orig="${escHtml(seg.original)}" data-curr="${escHtml(seg.text)}" onclick="openPronModal(this.dataset.orig, this.dataset.curr)">${escHtml(seg.text)}</span>`
          : escHtml(seg.text)
        ).join('')}</div>`;
    } else {
      bodyHtml = `<div class="scene-text no-conv">${escHtml(sc.original)}</div>`;
    }

    const buttons = isEditing
      ? `<button class="scene-toggle" onclick="cancelScriptEdit(${sc.scene})">취소</button>
         <button class="scene-toggle active" onclick="saveScriptOverride(${sc.scene})">저장</button>`
      : `<button class="scene-toggle ${conversionOn ? 'active' : ''}" onclick="toggleConversion()">한국어 발음 전환</button>
         <button class="scene-toggle" onclick="startScriptEdit(${sc.scene})">편집</button>
         ${sc.override_active ? `<button class="scene-toggle" onclick="resetScriptOverride(${sc.scene})" style="color:var(--error);">원본 복원</button>` : ''}`;

    const audioId = `audio-sc-${sc.scene}`;
    return `
      <div class="scene-card">
        <div class="scene-header">
          <span class="scene-num">#${String(sc.scene).padStart(2,'0')}</span>
          <span class="scene-voice">${sc.voice}</span>
          <span class="scene-label">${sc.label}${overrideBadge}</span>
        </div>
        <div class="scene-body">
          <div class="scene-body-row">
            <span class="label">발음 (TTS 입력)</span>
            <div style="margin-left:auto;display:flex;gap:6px;">${buttons}</div>
          </div>
          ${bodyHtml}
          ${isEditing ? '' : `<div style="margin-top:12px;">
            <audio class="preview-audio" controls src="/preview/audio/${QID}/${sc.scene}?t=${Date.now()}" id="${audioId}"
                   onerror="document.getElementById('${audioId}').parentElement.innerHTML='<div style=\\'color:var(--text-faint);font-size:12px;padding:8px;\\'>(아직 음성 미생성 — [슬라이드+음성+영상] 누르세요)</div>'"></audio>
          </div>`}
        </div>
      </div>`;
  }).join('');

  preview.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <div class="preview-section-title" style="margin:0;">ch${scriptCache.chapter} · scene 2개</div>
      <div style="font-size:12px;color:var(--text-faint);">[편집] 직접 수정 · 노란 글씨 클릭 → 발음 사전</div>
    </div>
    ${cards}`;
}

function startScriptEdit(scene) {
  editing[scene] = true;
  drawScriptCards();
}

function cancelScriptEdit(scene) {
  editing[scene] = false;
  drawScriptCards();
}

async function saveScriptOverride(scene) {
  const ta = document.getElementById(`script-edit-${scene}`);
  if (!ta) return;
  const text = ta.value;
  showToast('저장 중…', 'info');
  const res = await fetch(`/api/script/${QID}/${scene}`, {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text})
  });
  const data = await res.json();
  if (data.ok) {
    showToast('대본 저장됨 (재합성하려면 [강제 재빌드])', 'success');
    editing[scene] = false;
    renderScriptTab();
  } else {
    showToast('저장 실패', 'error');
  }
}

async function resetScriptOverride(scene) {
  if (!confirm(`scene ${scene} 의 사용자 편집을 지우고 자동 생성문으로 복원할까요?`)) return;
  const res = await fetch(`/api/script/${QID}/${scene}`, {method: 'DELETE'});
  const data = await res.json();
  if (data.ok) {
    showToast('원본 복원됨', 'success');
    renderScriptTab();
  }
}

function toggleConversion() {
  conversionOn = !conversionOn;
  drawScriptCards();
}

// ---- 발음 사전 모달 ----

let editingKey = null;

async function openPronModal(orig, curr) {
  document.getElementById('pron-key').value = orig || '';
  document.getElementById('pron-val').value = curr || '';
  document.getElementById('pron-modal-msg').textContent = '';
  document.getElementById('pron-delete-btn').style.display = orig ? 'inline-block' : 'none';
  editingKey = orig || null;
  document.getElementById('pron-modal').classList.add('open');
}

function closePronModal() {
  document.getElementById('pron-modal').classList.remove('open');
  editingKey = null;
}

async function savePron() {
  const k = document.getElementById('pron-key').value.trim();
  const v = document.getElementById('pron-val').value.trim();
  if (!k || !v) {
    document.getElementById('pron-modal-msg').textContent = '키워드와 발음을 모두 입력하세요.';
    return;
  }
  const res = await fetch('/api/pronunciations');
  const pron = await res.json();
  if (editingKey && editingKey !== k) delete pron[editingKey];
  pron[k] = v;
  const r2 = await fetch('/api/pronunciations', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({pron})
  });
  const d2 = await r2.json();
  if (d2.ok) {
    showToast(`발음 사전 저장 (${d2.count}개)`, 'success');
    closePronModal();
    renderScriptTab();
  } else {
    document.getElementById('pron-modal-msg').textContent = '저장 실패';
  }
}

async function deletePron() {
  if (!editingKey) return;
  const res = await fetch('/api/pronunciations');
  const pron = await res.json();
  delete pron[editingKey];
  await fetch('/api/pronunciations', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({pron})
  });
  showToast('삭제됨', 'success');
  closePronModal();
  renderScriptTab();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePronModal();
});

loadPreviewMedia('parsed');
</script>
</body>
</html>
