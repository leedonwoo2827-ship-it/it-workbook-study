<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발음 사전 — Exambook Studio</title>
<link rel="stylesheet" href="/static/styles.css">
<style>
.pron-table { width: 100%; border-collapse: collapse; background: white; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }
.pron-table th, .pron-table td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border-soft); font-size: 14px; }
.pron-table th { background: var(--bg-sidebar); font-weight: 600; color: var(--text-muted); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
.pron-table tr:last-child td { border-bottom: none; }
.pron-table input { width: 100%; padding: 6px 10px; border: 1px solid transparent; background: transparent; font-family: inherit; font-size: 14px; border-radius: 6px; }
.pron-table input:focus { outline: none; background: var(--sky-50); border-color: var(--sky-300); }
.btn-del { color: var(--error); background: transparent; border: none; cursor: pointer; padding: 4px 8px; border-radius: 4px; }
.btn-del:hover { background: rgba(239,68,68,0.1); }
.tts-test { background: var(--sky-50); border: 1px solid var(--sky-200); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 20px; }
.tts-test h3 { margin: 0 0 12px; font-size: 14px; color: var(--sky-700); }
.tts-test textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; min-height: 70px; resize: vertical; margin-bottom: 10px; }
.tts-row { display: flex; gap: 10px; align-items: center; }
.tts-row select { padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: white; font-size: 13px; }
.add-row { display: flex; gap: 10px; margin-top: 14px; }
.add-row input { flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-dot"></div>
        <div>Exambook Studio</div>
      </div>
    </div>
    <div class="sidebar-actions">
      <a class="btn-new" href="/" style="text-align:center;">← 목록으로</a>
    </div>
    <div class="search-wrap">
      <input class="search" placeholder="문항 검색" id="search">
    </div>
    <div class="sidebar-list">
      {% for id in all_ids %}
        <a class="q-item" href="/q/{{ id }}"><div class="q-id">{{ id }}</div></a>
      {% endfor %}
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>발음 사전</h1>
        <span class="meta">SQL 키워드 → 한국어 발음 매핑</span>
      </div>
      <div class="toolbar">
        <button class="btn btn-primary" onclick="saveAll()">저장</button>
      </div>
    </div>

    <div class="content">

      <div class="tts-test">
        <h3>🔊 발음 미리듣기</h3>
        <textarea id="test-text" placeholder="여기에 한 문장 입력 후 ▶ 합성. 발음 사전이 자동 적용됩니다.">SELECT 절은 GROUP BY 다음에 평가됩니다.</textarea>
        <div class="tts-row">
          <select id="test-voice">
            <option value="F2" selected>F2 (여성, 차분)</option>
            <option value="F1">F1</option>
            <option value="F3">F3</option>
            <option value="M3">M3 (남성)</option>
            <option value="M1">M1</option>
          </select>
          <select id="test-speed">
            <option value="0.9">0.9× 느림</option>
            <option value="1.0" selected>1.0× 보통</option>
            <option value="1.1">1.1×</option>
          </select>
          <button class="btn btn-primary" onclick="testTTS()">▶ 합성</button>
          <audio id="test-audio" controls style="flex:1;"></audio>
        </div>
      </div>

      <table class="pron-table" id="pron-table">
        <thead><tr><th>키워드</th><th>한글 발음</th><th></th></tr></thead>
        <tbody id="pron-body">
          {% for k, v in pron.items() %}
            <tr>
              <td><input type="text" value="{{ k }}" data-role="key"></td>
              <td><input type="text" value="{{ v }}" data-role="val"></td>
              <td><button class="btn-del" onclick="delRow(this)">삭제</button></td>
            </tr>
          {% endfor %}
        </tbody>
      </table>

      <div class="add-row">
        <input id="new-key" placeholder="새 키워드 (예: ROWNUM)">
        <input id="new-val" placeholder="한글 발음 (예: 로우넘)">
        <button class="btn btn-primary" onclick="addRow()">＋ 추가</button>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const toast = document.getElementById('toast');
function showToast(msg, kind='info') {
  toast.textContent = msg;
  toast.className = 'toast show ' + kind;
  setTimeout(() => toast.classList.remove('show'), 2400);
}

function delRow(btn) { btn.closest('tr').remove(); }

function addRow() {
  const k = document.getElementById('new-key').value.trim();
  const v = document.getElementById('new-val').value.trim();
  if (!k || !v) { showToast('키워드와 발음 둘 다 입력하세요', 'error'); return; }
  const tr = document.createElement('tr');
  tr.innerHTML = `<td><input type="text" value="${k}" data-role="key"></td>
                  <td><input type="text" value="${v}" data-role="val"></td>
                  <td><button class="btn-del" onclick="delRow(this)">삭제</button></td>`;
  document.getElementById('pron-body').appendChild(tr);
  document.getElementById('new-key').value = '';
  document.getElementById('new-val').value = '';
}

async function saveAll() {
  const pron = {};
  document.querySelectorAll('#pron-body tr').forEach(tr => {
    const k = tr.querySelector('[data-role=key]').value.trim();
    const v = tr.querySelector('[data-role=val]').value.trim();
    if (k && v) pron[k] = v;
  });
  const res = await fetch('/api/pronunciations', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({pron})
  });
  const data = await res.json();
  if (data.ok) showToast(`저장됨 (${data.count}개 항목)`, 'success');
  else showToast('저장 실패', 'error');
}

async function testTTS() {
  const text = document.getElementById('test-text').value.trim();
  if (!text) return;
  showToast('음성 합성 중…', 'info');
  const audio = document.getElementById('test-audio');
  const res = await fetch('/api/tts/preview', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      text,
      voice: document.getElementById('test-voice').value,
      speed: parseFloat(document.getElementById('test-speed').value),
    })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({detail: 'unknown'}));
    showToast('실패: ' + (err.detail || 'unknown'), 'error');
    return;
  }
  const blob = await res.blob();
  audio.src = URL.createObjectURL(blob);
  audio.play();
  showToast('합성 완료', 'success');
}
</script>
</body>
</html>
